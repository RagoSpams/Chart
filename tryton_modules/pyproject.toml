[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-health-midnight-disclosure"
version = "0.1.0"
description = "Synthetic demonstration of GNU Health disclosure through Midnight"
license = {file = "health_midnight_disclosure/COPYING"}
requires-python = ">=3.12"
dependencies = ["gnuhealth==5.0.5", "gnuhealth-lab==5.0.0"]

[project.entry-points."trytond.modules"]
health_midnight_disclosure = "health_midnight_disclosure"

[tool.setuptools.packages.find]
include = ["health_midnight_disclosure"]

[tool.setuptools.package-data]
health_midnight_disclosure = ["*.cfg", "*.xml", "view/*.xml", "COPYING"]
