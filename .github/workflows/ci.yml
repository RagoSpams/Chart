name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Compact CLI and toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh -o /tmp/compact-installer.sh
          sh /tmp/compact-installer.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-sensitive-files.mjs
      - run: python3 -m compileall -q tryton_modules
# Real devnet/GNU Health transactions are an explicit local integration run,
# not silently substituted by a mock in this job. See README and validation report.
